name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "30 4 * * 1"

jobs:
  hassfest:
    name: hassfest (валидация манифеста и интеграции)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS (валидация репозитория как custom repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
          # custom repository, не default store → в home-assistant/brands
          # записи нет; проверку бренд-иконки пропускаем осознанно.
          ignore: brands
